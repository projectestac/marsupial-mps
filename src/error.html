<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --fg: #1f1f1f;
        --muted: #6b6b6b;
        --rule: #d8d8d4;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #17181a;
            --fg: #f0f0ee;
            --muted: #9a9a96;
            --rule: #34353a;
        }
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: Georgia, "Times New Roman", Times, serif;
    }

    main {
        max-width: 32rem;
        text-align: center;
    }

    .code {
        margin: 0 0 1rem;
        font-size: 0.8rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
    }

    h1 {
        margin: 0 0 1rem;
        font-size: 2rem;
        font-weight: normal;
        line-height: 1.3;
    }

    p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--muted);
    }

    hr {
        width: 3rem;
        margin: 1.5rem auto;
        border: none;
        border-top: 1px solid var(--rule);
    }
</style>
</head>
<body>
<main>
    <p class="code">Error</p>
    <h1>Something went wrong</h1>
    <hr>
    <p>We were unable to process your request. Please try again later or contact your administrator if the problem persists.</p>
</main>
</body>
</html>
